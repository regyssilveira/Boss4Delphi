name: Registry submission

on:
  pull_request:
    paths:
      - "registry/packages/**"
      - "registry/publishers.json"
      - "registry/index-v2.json"
      - "scripts/validate-registry-submission.ps1"
      - "scripts/test-registry-community-governance.ps1"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/registry-package-submission.yml"
      - ".github/workflows/registry-submission.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate publisher scope and immutable metadata
        shell: pwsh
        run: |
          git fetch origin "${{ github.base_ref }}"
          ./scripts/validate-registry-submission.ps1 `
            -BaseRef "origin/${{ github.base_ref }}" `
            -Submitter "${{ github.actor }}"
      - name: Run negative validator tests
        shell: pwsh
        run: |
          ./scripts/test-registry-submission.ps1
          ./scripts/test-new-registry-submission.ps1
          ./scripts/test-registry-community-governance.ps1
