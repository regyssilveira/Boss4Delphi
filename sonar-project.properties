# Metadados do Projeto
sonar.projectKey=Boss4D
sonar.projectName=Boss4D
sonar.projectVersion=1.7.0

# Caminhos de Fontes e Testes
sonar.sources=src
sonar.tests=tests

# Codificacao dos arquivos fonte
sonar.sourceEncoding=UTF-8

# Padrao de exclusao (ignorar modulos baixados e lixos)
sonar.exclusions=**/modules/**,**/bin/**,**/*.log,**/*.bat,**/__history/**,**/__recovery/**
sonar.cpd.exclusions=src/GUI/**/*.pas,src/IDE/**/*.pas,tests/**/*.pas

# URL do Servidor do SonarQube (padrao local, altere se necessario)
sonar.host.url=http://localhost:9000

# Integracao de Relatorios de Testes Unitarios (DUnitX / NUnit)
sonar.delphi.nunit.reportPaths=.ci-build/win32

# Cobertura deve ser configurada somente quando um relatorio atual for produzido.
# Nao reutilize CodeCoverage_Summary.xml antigo: linhas obsoletas invalidam a analise.


# Supressão de falsos positivos do SonarQube para RTTI e Acoplamento Desacoplado (SOLID)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21

# e1: Ignorar UnusedProperty em arquivos de domínio (RTTI/JSON serialization)
sonar.issue.ignore.multicriteria.e1.ruleKey=community-delphi:UnusedProperty
sonar.issue.ignore.multicriteria.e1.resourceKey=src/Core/Domain/**/*.pas

# e2: Ignorar UnusedType nas interfaces das Portas (SOLID interfaces)
sonar.issue.ignore.multicriteria.e2.ruleKey=community-delphi:UnusedType
sonar.issue.ignore.multicriteria.e2.resourceKey=src/Core/Ports/**/*.pas

# e3: Ignorar UnusedRoutine para closure threads falsos positivos no instalador e classes de serviço
sonar.issue.ignore.multicriteria.e3.ruleKey=community-delphi:UnusedRoutine
sonar.issue.ignore.multicriteria.e3.resourceKey=src/**/*.pas

# e4: Ignorar UnusedImport falsos positivos nas units de testes e arquivos em geral
sonar.issue.ignore.multicriteria.e4.ruleKey=community-delphi:UnusedImport
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*

# e5: Ignorar ImportSpecificity (falsos positivos em interfaces que precisam de imports)
sonar.issue.ignore.multicriteria.e5.ruleKey=community-delphi:ImportSpecificity
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*

# e6: Ignorar TooLongLine (estilo de tamanho de linha)
sonar.issue.ignore.multicriteria.e6.ruleKey=community-delphi:TooLongLine
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*

# e7: Ignorar UnusedLocalVariable falsos positivos em todo o projeto
sonar.issue.ignore.multicriteria.e7.ruleKey=community-delphi:UnusedLocalVariable
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*

# e8: Ignorar CognitiveComplexityRoutine (complexidade cognitiva de rotinas legadas)
sonar.issue.ignore.multicriteria.e8.ruleKey=community-delphi:CognitiveComplexityRoutine
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*

# e9: Ignorar CyclomaticComplexityRoutine (complexidade ciclomática de rotinas legadas)
sonar.issue.ignore.multicriteria.e9.ruleKey=community-delphi:CyclomaticComplexityRoutine
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*

# e10: Rotinas de serializacao/orquestracao sao cobertas por testes de regressao
sonar.issue.ignore.multicriteria.e10.ruleKey=community-delphi:TooLargeRoutine
sonar.issue.ignore.multicriteria.e10.resourceKey=src/Adapters/Json/Boss4D.Adapters.Json.pas

# e11: Orquestracao transacional coberta por testes de regressao
sonar.issue.ignore.multicriteria.e11.ruleKey=community-delphi:TooLargeRoutine
sonar.issue.ignore.multicriteria.e11.resourceKey=src/Core/Services/Boss4D.Core.Services.Install.pas

# e12: TryGetValue garante a inicializacao antes do uso; falso positivo do parser
sonar.issue.ignore.multicriteria.e12.ruleKey=community-delphi:VariableInitialization
sonar.issue.ignore.multicriteria.e12.resourceKey=src/Core/Services/Boss4D.Core.Services.Install.pas

# e13: Propriedades de mocks sao consumidas por outra unit de testes
sonar.issue.ignore.multicriteria.e13.ruleKey=community-delphi:UnusedProperty
sonar.issue.ignore.multicriteria.e13.resourceKey=tests/**/*.pas

# e14: Campos de mocks DUnitX formam o protocolo de verificacao entre teste e fake
sonar.issue.ignore.multicriteria.e14.ruleKey=community-delphi:PublicField
sonar.issue.ignore.multicriteria.e14.resourceKey=tests/**/*.pas

# e15: O parser apenas despacha a gramatica completa de ide profile; as regras
# de negocio permanecem nos servicos testados separadamente
sonar.issue.ignore.multicriteria.e15.ruleKey=community-delphi:TooLargeRoutine
sonar.issue.ignore.multicriteria.e15.resourceKey=src/CLI/Boss4D.CLI.Parser.pas

# e16: BuildCommand preserva compatibilidade de construtor para consumidores
sonar.issue.ignore.multicriteria.e16.ruleKey=community-delphi:TooManyDefaultParameters
sonar.issue.ignore.multicriteria.e16.resourceKey=src/Core/Services/Boss4D.Core.Services.BuildCommand.pas

# e17: O servico de Registro permite injecao opcional de todas as fronteiras
# transacionais; os defaults mantem compatibilidade da API
sonar.issue.ignore.multicriteria.e17.ruleKey=community-delphi:TooManyDefaultParameters
sonar.issue.ignore.multicriteria.e17.resourceKey=src/Core/Services/Boss4D.Core.Services.IDERegistration.pas

# e18: Construtores de composicao recebem dependencias, nao dados primitivos
sonar.issue.ignore.multicriteria.e18.ruleKey=community-delphi:TooManyParameters
sonar.issue.ignore.multicriteria.e18.resourceKey=src/Core/Services/Boss4D.Core.Services.IDERegistration.pas

# e19: Rotinas locais mantem o plano/rollback atomico dentro da operacao
sonar.issue.ignore.multicriteria.e19.ruleKey=community-delphi:TooManyNestedRoutines
sonar.issue.ignore.multicriteria.e19.resourceKey=src/Core/Services/Boss4D.Core.Services.IDERegistration.pas

# e20: CurrentValue integra o DTO publico de preview mesmo sem consumidor interno
sonar.issue.ignore.multicriteria.e20.ruleKey=community-delphi:UnusedProperty
sonar.issue.ignore.multicriteria.e20.resourceKey=src/Core/Services/Boss4D.Core.Services.IDERegistration.pas

# e21: Application service recebe portas de composicao explicitamente
sonar.issue.ignore.multicriteria.e21.ruleKey=community-delphi:TooManyParameters
sonar.issue.ignore.multicriteria.e21.resourceKey=src/Core/Services/Boss4D.Core.Services.IDEProfileApplication.pas
